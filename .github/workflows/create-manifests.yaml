name: Create Docker Manifests

on:
  workflow_call:
    inputs:
      build-type:
        description: "Type of build (prod or dev)"
        required: true
        type: string
      version:
        description: "Version tag for production builds (ignored for dev)"
        required: false
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0
      - name: Login to Docker Hub
        uses: docker/login-action@3227f5311cb93ffd14d13e65d8cc400d30f4dd8a
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create Docker manifests for dev
        if: ${{ inputs.build-type == 'dev' }}
        run: |
          docker buildx imagetools create -t circa10a/shoutrrr:latest-dev \
            circa10a/shoutrrr:amd64-dev \
            circa10a/shoutrrr:i386-dev \
            circa10a/shoutrrr:armhf-dev \
            circa10a/shoutrrr:arm64v8-dev \
            circa10a/shoutrrr:riscv64-dev
      - name: Create Docker manifests for prod
        if: ${{ inputs.build-type == 'prod' }}
        run: |
          docker buildx imagetools create -t circa10a/shoutrrr:${{ inputs.version }} \
            circa10a/shoutrrr:amd64-${{ inputs.version }} \
            circa10a/shoutrrr:i386-${{ inputs.version }} \
            circa10a/shoutrrr:armhf-${{ inputs.version }} \
            circa10a/shoutrrr:arm64v8-${{ inputs.version }} \
            circa10a/shoutrrr:riscv64-${{ inputs.version }}
          docker buildx imagetools create -t circa10a/shoutrrr:latest \
            circa10a/shoutrrr:amd64-latest \
            circa10a/shoutrrr:i386-latest \
            circa10a/shoutrrr:armhf-latest \
            circa10a/shoutrrr:arm64v8-latest \
            circa10a/shoutrrr:riscv64-latest
